<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b1b" />
    <script>
      // Apply an explicit preference before CSS paints; otherwise start dark.
      try {
        if (localStorage.getItem('portfolio-theme-preference') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f7f8f6';
        }
      } catch (_) {}
    </script>
    <meta
      name="description"
      content="Songqiao Sun — AI software engineer and game developer. Exploring what AI makes possible in software and game development."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Songqiao Sun's Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
